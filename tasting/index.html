<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HaproID Profiles</title>

    <meta
        name="description"
        content="Explore verified profiles, team members, and users on HaproID."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #6b7280;
        }

        #profiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .card h2 {
            margin-bottom: 8px;
        }

        .role {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .bio {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .profile-link {
            display: inline-block;
            padding: 10px 18px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
        }

        .profile-link:hover {
            opacity: 0.85;
        }

        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>HaproID Profiles</h1>
        <p>Verified profiles, users and team members.</p>
    </header>

    <main id="profiles">
        <p>Loading profiles...</p>
    </main>

</div>

<script src="/assets/JS/build.js"></script>

</body>
</html>
