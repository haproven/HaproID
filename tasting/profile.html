<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | HaproID</title>

    <meta
        name="description"
        content="Verified digital profile powered by HaproID."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
            min-height: 100vh;
        }

        .container {
            width: min(700px, 92%);
            margin: 60px auto;
        }

        .profile {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
        }

        .profile-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0 auto 24px;
            background: #eee;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .role {
            display: inline-block;
            padding: 7px 16px;
            border-radius: 30px;
            background: #eee;
            font-size: 14px;
            text-transform: capitalize;
        }

        .bio {
            margin: 25px auto;
            max-width: 560px;
            line-height: 1.7;
            color: #555;
        }

        .email {
            display: inline-block;
            color: #111;
            text-decoration: none;
            margin-top: 5px;
        }

        .email:hover {
            text-decoration: underline;
        }

        .profile-id {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .profile-url {
            margin-top: 8px;
            font-size: 13px;
            color: #999;
            word-break: break-all;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 11px 20px;
            border-radius: 10px;
            background: #111;
            color: #fff;
            text-decoration: none;
        }

        .back:hover {
            opacity: 0.85;
        }

        .loading,
        .error {
            text-align: center;
            padding: 40px;
        }

        .error h2 {
            margin-bottom: 10px;
        }

        .error p {
            color: #666;
        }

        .hidden {
            display: none;
        }

    </style>

</head>


<body>

    <main class="container">

        <!-- ==============================
             LOADING
        =============================== -->

        <section
            id="loading"
            class="loading"
        >

            <p>
                Loading profile...
            </p>

        </section>


        <!-- ==============================
             ERROR
        =============================== -->

        <section
            id="error"
            class="error hidden"
        >

            <h2>
                Profile Not Found
            </h2>

            <p id="errorMessage">
                The requested profile could not be found.
            </p>

            <a
                href="/"
                class="back"
            >
                ← All Profiles
            </a>

        </section>


        <!-- ==============================
             PROFILE
        =============================== -->

        <section
            id="profile"
            class="profile hidden"
        >

            <img
                id="profileImage"
                class="profile-image"
                src=""
                alt=""
            >


            <h1 id="profileName"></h1>


            <span
                id="profileRole"
                class="role"
            ></span>


            <p
                id="profileBio"
                class="bio"
            ></p>


            <a
                id="profileEmail"
                class="email"
                href=""
            ></a>


            <div
                id="profileId"
                class="profile-id"
            ></div>


            <div
                id="profileUrl"
                class="profile-url"
            ></div>


            <a
                href="/"
                class="back"
            >
                ← All Profiles
            </a>

        </section>

    </main>


<script>
async function loadProfile() {

    const loading =
        document.getElementById(
            "loading"
        );

    const profile =
        document.getElementById(
            "profile"
        );

    const error =
        document.getElementById(
            "error"
        );

    const errorMessage =
        document.getElementById(
            "errorMessage"
        );

    try {

        const pathParts =
            window.location.pathname
                .split("/")
                .filter(Boolean);

        if (
            pathParts.length !== 2
        ) {

            throw new Error(
                "Invalid profile URL."
            );

        }

        const role =
            decodeURIComponent(
                pathParts[0]
            )
            .toLowerCase()
            .trim();

        const id =
            decodeURIComponent(
                pathParts[1]
            )
            .trim();

        const validRoles = [
            "founder",
            "team",
            "user"
        ];

        if (
            !validRoles.includes(role)
        ) {

            throw new Error(
                "Invalid profile role."
            );

        }

        const response =
            await fetch(
                `/api/profiles/${encodeURIComponent(role)}/${encodeURIComponent(id)}`,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            if (
                response.status === 404
            ) {

                throw new Error(
                    "Profile not found."
                );

            }

            throw new Error(
                `Server error: ${response.status}`
            );

        }

        const result =
            await response.json();

        if (
            !result.success ||
            !result.profile
        ) {

            throw new Error(
                "Invalid profile response."
            );

        }

        const user =
            result.profile;

        const name =
            user.name ||
            "Unknown User";

        const profileRole =
            String(
                user.role ||
                role
            )
            .toLowerCase()
            .trim();

        const roleTitle =
            profileRole
                .charAt(0)
                .toUpperCase() +
            profileRole.slice(1);

        const bio =
            user.bio || "";

        const email =
            user.email || "";

        const image =
            user.image || "";

        const profileId =
            user.id || id;


        /*
         * SEO
         */

        document.title =
            `${name} | ${roleTitle} | HaproID`;

        const description =
            bio ||
            `${name} is a ${roleTitle} profile on HaproID.`;

        let meta =
            document.querySelector(
                'meta[name="description"]'
            );

        if (!meta) {

            meta =
                document.createElement(
                    "meta"
                );

            meta.name =
                "description";

            document.head.appendChild(
                meta
            );

        }

        meta.content =
            description;


        /*
         * Profile UI
         */

        document.getElementById(
            "profileName"
        ).textContent = name;

        document.getElementById(
            "profileRole"
        ).textContent =
            roleTitle;

        document.getElementById(
            "profileBio"
        ).textContent =
            bio;

        document.getElementById(
            "profileId"
        ).textContent =
            `Profile ID: ${profileId}`;


        /*
         * Image
         */

        const imageElement =
            document.getElementById(
                "profileImage"
            );

        if (image) {

            imageElement.src =
                image;

            imageElement.alt =
                name;

            imageElement.classList.remove(
                "hidden"
            );

        } else {

            imageElement.classList.add(
                "hidden"
            );

        }


        /*
         * Email
         */

        const emailElement =
            document.getElementById(
                "profileEmail"
            );

        if (email) {

            emailElement.href =
                `mailto:${email}`;

            emailElement.textContent =
                email;

            emailElement.classList.remove(
                "hidden"
            );

        } else {

            emailElement.classList.add(
                "hidden"
            );

        }


        /*
         * Show
         */

        loading.classList.add(
            "hidden"
        );

        error.classList.add(
            "hidden"
        );

        profile.classList.remove(
            "hidden"
        );

    } catch (err) {

        console.error(
            "❌ Profile error:",
            err
        );

        loading.classList.add(
            "hidden"
        );

        profile.classList.add(
            "hidden"
        );

        error.classList.remove(
            "hidden"
        );

        errorMessage.textContent =
            err.message;

    }
}

loadProfile();
</script>

</body>

</html>
